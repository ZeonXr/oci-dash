name: oci-dash

services:
  app:
    image: ghcr.io/zeonxr/oci-dash:v0.5.2
    restart: unless-stopped
    stop_grace_period: 35s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      - "./data:/data"
    logging:
      driver: local
