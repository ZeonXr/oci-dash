name: oci-dash

x-common: &common
  image: oci-dash:local
  restart: unless-stopped
  init: true
  environment: &environment
    ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run npm run bootstrap to create .env first}
    MASTER_KEY: ${MASTER_KEY:?Run npm run bootstrap to create .env first}
    APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
    DEMO_MODE: ${DEMO_MODE:-true}
    DATABASE_PATH: /data/oci-dash.db
    NEXT_TELEMETRY_DISABLED: "1"
  volumes:
    - app-data:/data
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  web:
    <<: *common
    build: .
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  worker:
    <<: *common
    command: ["node", "dist/worker.mjs"]
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD", "node", "dist/worker-health.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  app-data:
