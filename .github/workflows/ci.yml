name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Check runner-provided Chrome
        run: google-chrome --version
      - name: Build local application image
        run: docker build -t oci-dash:local .
      - name: Verify isolated container lifecycle
        run: npm run test:runtime
      - name: Verify isolated backup and restore
        run: npm run test:backup
      - name: Browser tests in an isolated demonstration deployment
        run: npm run test:e2e:isolated -- --no-build
